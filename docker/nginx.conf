server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # index.html nunca se cachea: así un despliegue nuevo se ve al recargar.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Todo lo de assets/ lleva un hash en el nombre, se puede cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
